<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu button</title>
<style>
  body { font: 16px/1.5 Arial, sans-serif; color: #1a1a1a; background: #ffffff; margin: 24px; }
  button { font: 14px Arial, sans-serif; padding: 8px 16px; }
</style>
</head>
<body>
<main>
  <h1>Payments</h1>
  <!-- A menu button whose aria-controls points at an id that does not exist (the menu is not rendered yet). -->
  <button type="button" id="move" aria-haspopup="menu" aria-expanded="false" aria-controls="move-menu">Move money</button>
</main>
</body>
</html>
