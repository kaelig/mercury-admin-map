<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invalid field</title>
<style>
  body { font: 16px/1.5 Arial, sans-serif; color: #1a1a1a; background: #ffffff; margin: 24px; }
  input { font: 16px Arial, sans-serif; padding: 8px; }
</style>
</head>
<body>
<main>
  <h1>Invite a teammate</h1>
  <form aria-label="Invite">
    <label for="email">Email</label>
    <input id="email" type="email" required aria-invalid="true" aria-describedby="email-hint" aria-errormessage="email-error">
    <p id="email-hint">Use your work email</p>
    <p id="email-error" role="alert">Enter a valid email address</p>
  </form>
</main>
</body>
</html>
