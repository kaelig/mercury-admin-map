<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Links in a sentence</title>
<style>
  body { font: 16px/1.5 Arial, sans-serif; color: #1a1a1a; background: #ffffff; margin: 24px; }
  p { font: 14px/20px Arial, sans-serif; }
</style>
</head>
<body>
<main>
  <h1>Annual report</h1>
  <!-- Three one-digit links a space apart: their circles overlap, but they sit in a sentence. -->
  <p>Go to page <a href="#p1">1</a> <a href="#p2">2</a> <a href="#p3">3</a> of the annual report.</p>
</main>
</body>
</html>
