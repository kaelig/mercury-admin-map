<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Layers</title>
<style>
  body { font: 16px/1.4 sans-serif; margin: 24px; color: #111; background: #fff; }
  button, input { font: inherit; margin: 8px; }
  .row { cursor: pointer; display: inline-block; margin: 8px; padding: 6px 12px; border: 1px solid #ccc; }
  .backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.3); }
  .dialog { position: absolute; top: 80px; left: 480px; width: 420px; padding: 24px; background: #fff; border-radius: 8px; }
  .dialog label { display: block; }
  .wrap { position: relative; display: inline-block; }
  [role=menu] { position: absolute; top: 48px; left: 0; margin: 0; padding: 4px 0; list-style: none; background: #fff; border: 1px solid #ccc; }
  [role=menu] li { padding: 4px 12px; }
  .pop { position: absolute; top: 200px; left: 24px; width: 220px; padding: 8px; background: #fff; border: 1px solid #ccc; }
</style></head>
<body>
<main>
  <h1>Transfers</h1>
  <!-- Moves focus inside and keeps Tab there, but ignores Esc, and its only exit is Back: no close
       control the dialog check knows. -->
  <button id="review-open">Review transfer</button>
  <!-- Nothing inside takes focus, so Tab never reaches it; Esc closes it and returns focus. -->
  <button id="terms-open">View terms</button>
  <!-- Opens a menu and focuses its first item, but ignores Esc. -->
  <div class="wrap">
    <button id="sort" aria-haspopup="menu" aria-expanded="false" aria-controls="sort-menu">Sort</button>
    <ul role="menu" id="sort-menu" aria-labelledby="sort" hidden>
      <li role="menuitem" tabindex="-1">Newest first</li>
      <li role="menuitem" tabindex="-1">Oldest first</li>
    </ul>
  </div>
  <!-- Opens a panel at the end of the page and leaves focus on the button: the next Tab goes to Done. -->
  <button id="limits" aria-expanded="false">Limits help</button>
  <button>Done</button>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const FOCUSABLE = 'button, input, a[href]';

  $('review-open').addEventListener('click', (e) => {
    const opener = e.currentTarget;
    const backdrop = document.createElement('div');
    backdrop.className = 'backdrop';
    backdrop.innerHTML = '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="review-title">'
      + '<h2 id="review-title">Transfer review</h2><label>Memo <input></label>'
      + '<div><button data-exit>Back</button><button data-exit>Send transfer</button></div></div>';
    document.body.append(backdrop);
    const dialog = backdrop.firstElementChild;
    dialog.addEventListener('keydown', (k) => {
      if (k.key !== 'Tab') return;
      const items = [...dialog.querySelectorAll(FOCUSABLE)];
      const i = items.indexOf(document.activeElement);
      if (k.shiftKey && i <= 0) {
        k.preventDefault();
        items.at(-1).focus();
      } else if (!k.shiftKey && i === items.length - 1) {
        k.preventDefault();
        items[0].focus();
      }
    });
    for (const b of dialog.querySelectorAll('[data-exit]')) b.addEventListener('click', () => { backdrop.remove(); opener.focus(); });
    dialog.querySelector(FOCUSABLE).focus();
  });

  $('terms-open').addEventListener('click', (e) => {
    const opener = e.currentTarget;
    const backdrop = document.createElement('div');
    backdrop.className = 'backdrop';
    backdrop.innerHTML = '<div class="dialog" role="dialog" aria-modal="true" aria-label="Terms">'
      + '<h2>Terms</h2><p>Transfers over $10,000 are reviewed.</p><div class="row">Got it</div></div>';
    document.body.append(backdrop);
    const onKey = (k) => {
      if (k.key !== 'Escape') return;
      backdrop.remove();
      document.removeEventListener('keydown', onKey);
      opener.focus();
    };
    document.addEventListener('keydown', onKey);
  });

  $('sort').addEventListener('click', (e) => {
    const menu = $('sort-menu');
    menu.hidden = !menu.hidden;
    e.currentTarget.setAttribute('aria-expanded', String(!menu.hidden));
    if (!menu.hidden) menu.querySelector('[role=menuitem]').focus();
  });

  $('limits').addEventListener('click', (e) => {
    const open = document.querySelector('.pop');
    if (open) open.remove();
    else {
      const pop = document.createElement('div');
      pop.className = 'pop';
      pop.innerHTML = 'Daily limits reset at midnight. <a href="#limits-guide">Read the guide</a>';
      document.body.append(pop);
    }
    e.currentTarget.setAttribute('aria-expanded', String(!open));
  });
</script>
</body></html>
