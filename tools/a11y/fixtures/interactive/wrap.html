<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tab wrap</title>
<style>body { font: 16px/1.4 sans-serif; margin: 24px; color: #111; background: #fff; } button { font: inherit; margin: 8px; }</style></head>
<body>
<main>
  <h1>Transactions</h1>
  <button>Before</button>
  <!-- A non-modal filter bar that sends Tab from its last button back to its first. It leaves Esc and
       Shift+Tab alone, so Shift+Tab gets out: no trap, but Tab never reaches After. -->
  <div role="group" aria-label="Filters" id="filters">
    <button>Status</button><button>Amount</button><button>Date</button>
  </div>
  <button>After</button>
</main>
<script>
  const bar = document.getElementById('filters');
  bar.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab' || e.shiftKey) return;
    const items = [...bar.querySelectorAll('button')];
    if (document.activeElement !== items.at(-1)) return;
    e.preventDefault();
    items[0].focus();
  });
</script>
</body></html>
